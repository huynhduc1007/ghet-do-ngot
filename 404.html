<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghét đồ ngọt đã chuyển nhà</title>
<meta http-equiv="refresh" content="1; url=https://ghetdongot.com/">
<link rel="canonical" href="https://ghetdongot.com/">
<style>
  :root{--ac:#A85C22;--ink:#241A10;--soft:#8A7B68;--bg:#FAF6EE}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 16px;box-sizing:border-box}
  h1{font-family:Georgia,serif;font-style:italic;color:var(--ac);font-size:34px;margin:0 0 10px}
  p{color:var(--soft);margin:0 0 22px;line-height:1.5}
  a.btn{display:inline-block;background:var(--ac);color:#fff;text-decoration:none;font-weight:700;padding:14px 22px;border-radius:12px}
  small{display:block;margin-top:14px;color:var(--soft)}
</style>
</head>
<body>
<main>
  <h1>Ghét đồ ngọt</h1>
  <p>Trang đặt bánh đã chuyển sang địa chỉ mới.<br>Đang chuyển bạn sang…</p>
  <a class="btn" id="go" href="https://ghetdongot.com/">Mở ghetdongot.com</a>
  <small>Nhớ lưu lại link mới nhé!</small>
</main>
<script>
  // Keep the sub-path (admin/), query and hash: /ghet-do-ngot/admin/?x#y → ghetdongot.com/admin/?x#y
  var rest = location.pathname.replace(/^\/ghet-do-ngot\/?/, '').replace(/index\.html$/, '');
  var to = 'https://ghetdongot.com/' + rest + location.search + location.hash;
  document.getElementById('go').href = to;
  location.replace(to);
</script>
</body>
</html>
