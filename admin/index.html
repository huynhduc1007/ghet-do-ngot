<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ghét đồ ngọt · Quản lý</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#A85C22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ghét đồ ngọt">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Lora:ital,wght@1,700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  :root{--ac:#A85C22;--acd:#8F4E1B;--ink:#241A10;--soft:#8A7B68;--bg:#FAF6EE;--line:#E8DCC8;--ok:#2E7D4F;--warn:#B3261E;--sheet:#fff;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Be Vietnam Pro',system-ui,sans-serif;font-size:15px}
  button,input,textarea,select{font:inherit;color:inherit}
  .app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto}
  .top{background:var(--ac);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
  .top .t{flex:1;min-width:0}
  .brand{font-family:'Lora',serif;font-style:italic;font-weight:700;font-size:20px;line-height:1.2}
  .sub{font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .icon-btn{background:rgba(255,255,255,.18);border:none;color:#fff;width:38px;height:38px;border-radius:10px;font-size:18px;cursor:pointer}
  .back{background:none;border:none;color:#FBE7D3;font-weight:700;font-size:15px;padding:0;cursor:pointer}
  main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 16px}
  .nav{display:flex;border-top:1px solid var(--line);background:#fff;padding-bottom:env(safe-area-inset-bottom)}
  .nav button{flex:1;background:none;border:none;padding:8px 0 9px;font-size:11.5px;color:var(--soft);font-weight:600;position:relative;cursor:pointer}
  .nav button b{display:block;font-size:20px;line-height:1.2}
  .nav button.on{color:var(--ac)}
  .badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--warn);color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:9px;padding:0 4px;line-height:17px}
  .chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
  .chip{flex:0 0 auto;padding:7px 12px;border-radius:999px;border:1px solid #cdbfa8;background:#fff;font-size:13px;font-weight:600;cursor:pointer}
  .chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
  .box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
  .h{font-size:12px;font-weight:700;color:var(--soft);text-transform:uppercase;letter-spacing:.3px;margin:2px 0 8px}
  .todo{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
  .todo b{color:var(--ac);font-size:16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:8px;cursor:pointer;position:relative}
  .card.cancel{opacity:.55}
  .card.new{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn) inset}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .id{font-weight:700;color:var(--ac);font-size:14px}
  .pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .p-Mới{background:#FFF4B8;color:#7A5300}.p-xn{background:#E6F4EC;color:var(--ok)}.p-lam{background:#E3EEFB;color:#1F5FA8}
  .p-giao{background:#E6F4EC;color:var(--ok)}.p-huy{background:#eee;color:#777}
  .p-owe{background:#FDE7D3;color:var(--acd)}.p-ok{background:#E6F4EC;color:var(--ok)}.p-bad{background:#FADBD8;color:var(--warn)}
  .nm{font-weight:700;font-size:15px;margin-top:3px}
  .meta{font-size:12.5px;color:var(--soft)}
  .items{font-size:13.5px;margin-top:4px;line-height:1.45}
  .items i{color:var(--ac)}
  .money{font-weight:700}
  .newdot{position:absolute;top:-6px;right:10px;background:var(--warn);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px}
  .empty{text-align:center;color:var(--soft);padding:30px 10px}
  label.l{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}
  .seg{display:flex;flex-wrap:wrap;gap:6px}
  .seg button{padding:8px 11px;border-radius:10px;border:1px solid #cdbfa8;background:#fff;font-size:13.5px;font-weight:600;cursor:pointer}
  .seg button.on{background:var(--ac);border-color:var(--ac);color:#fff}
  .inp{width:100%;background:#fff;border:1px solid #cdbfa8;border-radius:10px;padding:10px 12px;font-size:16px}
  textarea.inp{min-height:70px;resize:vertical}
  .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
  .two>*{min-width:0}
  .inp{min-width:0;max-width:100%}
  /* iOS Safari keeps a date input at its own minimum width (it spilled over the next field) unless its native look is off */
  input[type=date].inp{-webkit-appearance:none;appearance:none;display:block;width:100%;height:46px;text-align:left}
  .inp:not(textarea){height:46px}
  input[type=date].inp::-webkit-date-and-time-value{text-align:left}
  .btn{display:block;width:100%;background:var(--ac);color:#fff;text-align:center;font-weight:700;padding:13px;border-radius:12px;font-size:15px;border:none;margin-top:10px;cursor:pointer;text-decoration:none}
  .btn.g{background:#fff;color:var(--acd);border:1px solid var(--ac)}
  .btn:disabled{opacity:.55}
  .acts{display:flex;gap:8px}
  .acts a,.acts button{flex:1;text-align:center;font-size:13.5px;font-weight:700;padding:10px 0;border-radius:10px;background:#F3EBDD;color:var(--acd);text-decoration:none;border:none;cursor:pointer}
  .sumrow{display:flex;justify-content:space-between;font-size:14px;padding:3px 0}
  .sumrow.t{font-weight:700;font-size:16px;border-top:1px solid var(--line);margin-top:4px;padding-top:7px}
  .msg{padding:10px 12px;border-radius:10px;margin-top:10px;font-size:14px}
  .msg.ok{background:#E6F4EC;color:var(--ok)}.msg.bad{background:#FADBD8;color:var(--warn)}
  .stock{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:7px}
  .stock b{font-size:14px}.stock small{display:block;color:var(--soft);font-size:12px;margin-top:1px}
  .stock .r{text-align:right;white-space:nowrap}
  .stock.done{border-color:var(--ok);background:#F2FAF5}
  .stock input{width:96px;text-align:right}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
  .kpi small{display:block;font-size:11.5px;color:var(--soft)}.kpi b+small{margin-top:2px;font-size:11px}.kpi b{font-size:17px}
  table{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border-radius:12px;overflow:hidden}
  th{background:var(--ac);color:#fff;padding:8px 6px;text-align:left;font-weight:700}
  td{padding:8px 6px;border-bottom:1px solid var(--line)}
  .line{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;margin-bottom:10px;position:relative}
  .line .x{position:absolute;top:6px;right:8px;border:none;background:none;font-size:20px;color:var(--warn);cursor:pointer}
  .addline{width:100%;border:1px dashed var(--ac);border-radius:12px;padding:11px;background:none;color:var(--acd);font-weight:700;cursor:pointer}
  .rl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);cursor:pointer}
  .rl:last-child{border-bottom:none}
  .rl .q{font-weight:700;font-size:16px;white-space:nowrap;text-align:right}
  .rl small{display:block;font-size:12px;color:var(--soft);font-weight:400}
  .rl.short small.k{color:var(--warn);font-weight:700}
  .rl.done{opacity:.4}.rl.done .nmi{text-decoration:line-through}
  .chip.off{color:var(--soft);border-style:dashed}
  .overlay{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
  .cardimg{display:block;width:100%;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.15);background:#fff;-webkit-touch-callout:default}
  .login{max-width:420px;margin:12vh auto 0;padding:24px;text-align:center}
  .login .logo{width:84px;height:84px;border-radius:20px;margin:0 auto 14px;display:block}
  .login h1{font-family:'Lora',serif;font-style:italic;color:var(--ac);font-size:30px;margin:0 0 6px}
  .login p{color:var(--soft);line-height:1.5}
  #gbtn{display:flex;justify-content:center;margin:22px 0 10px;min-height:44px}
  .spin{display:inline-block;width:18px;height:18px;border:2px solid rgba(168,92,34,.3);border-top-color:var(--ac);border-radius:50%;animation:s .8s linear infinite;vertical-align:-3px}
  @keyframes s{to{transform:rotate(360deg)}}
  .toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#241A10;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;max-width:90%;text-align:center}
</style>
</head>
<body>

<!-- Sign in -->
<section id="loginView" class="login" hidden>
  <img class="logo" src="icon-192.png" alt="">
  <h1>Ghét đồ ngọt</h1>
  <p>Quản lý đơn, kho và lãi.<br>Đăng nhập bằng Gmail đã được cấp quyền.</p>
  <div id="gbtn"></div>
  <div id="loginMsg" class="msg bad" hidden></div>
</section>

<div class="app" id="app" hidden>
  <header class="top">
    <div class="t"><div class="brand">Ghét đồ ngọt</div><div class="sub" id="sub"></div></div>
    <button class="icon-btn" id="refreshBtn" aria-label="Tải lại">↻</button>
    <button class="icon-btn" id="menuBtn" aria-label="Tài khoản">☰</button>
  </header>
  <main id="main"></main>
  <nav class="nav" id="nav">
    <button data-v="orders" class="on"><b>🧾</b>Đơn<span class="badge" id="newBadge" hidden></span></button>
    <button data-v="stock"><b>📦</b>Kho</button>
    <button data-v="buy"><b>🛒</b>Mua</button>
    <button data-v="count"><b>⚖️</b>Cân</button>
    <button data-v="recipes"><b>📖</b>Công thức</button>
    <button data-v="profit"><b>📈</b>Lãi</button>
  </nav>
</div>

<!-- Order detail / card: full-screen layers over the app -->
<div class="overlay" id="detail" hidden>
  <header class="top"><div class="t"><button class="back" data-close="detail">‹ Đơn hàng</button>
    <div class="brand" id="dTitle" style="font-size:18px"></div><div class="sub" id="dSub"></div></div></header>
  <main id="dBody"></main>
</div>
<div class="overlay" id="cardView" hidden>
  <header class="top"><div class="t"><button class="back" data-close="cardView">‹ Quay lại</button>
    <div class="sub" style="margin-top:4px">Phiếu xác nhận</div></div></header>
  <main id="cBody"></main>
</div>

<script>
// ---------------------------------------------------------------------------------------------
// EDIT ME: same web app URL as the order page; OAuth client from Google Cloud (Google Auth Platform).
// ---------------------------------------------------------------------------------------------
const CONFIG = {
  ENDPOINT: 'https://script.google.com/macros/s/AKfycbytw7Mglimx_8wVc-_2dkABlB7G1N20UNY37S8f534rvTQ9sH_36UxFYj9OE9cwvs0/exec',
  CLIENT_ID: '616345425764-repc38e7g8v867vnga2gm353868mcl5b.apps.googleusercontent.com',
  REFRESH_MS: 60000,
};
const STATUS = ['Mới', 'Đã xác nhận', 'Đang làm', 'Đã giao', 'Hủy'];
const PAYMENT = ['Chưa CK', 'Khách báo đã CK', 'Đã CK'];
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const vnd = n => Math.round(Number(n) || 0).toLocaleString('vi-VN') + 'đ';
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k){ try { localStorage.removeItem(k); } catch (e) {} },
};
function toast(t){ const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }

// ---------------- API + sign-in ----------------
let session = store.get('gdn.session', null);   // { token, email, exp }

async function api(action, data){
  const r = await fetch(CONFIG.ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action, session: session && session.token }, data || {})) });
  const res = await r.json();
  if (!res.ok) {
    const err = String(res.error || 'Có lỗi, thử lại.');
    if (err.indexOf('AUTH:') === 0) { signOut(err.slice(5).trim()); throw new Error(err.slice(5).trim()); }
    throw new Error(err);
  }
  return res;
}

function showLogin(message){
  $('app').hidden = true; $('loginView').hidden = false;
  $('loginMsg').hidden = !message; $('loginMsg').textContent = message || '';
  const init = () => {
    if (!window.google || !google.accounts || !google.accounts.id) return setTimeout(init, 200);
    google.accounts.id.initialize({ client_id: CONFIG.CLIENT_ID, callback: onGoogle, auto_select: false, ux_mode: 'popup' });
    google.accounts.id.renderButton($('gbtn'), { theme: 'outline', size: 'large', shape: 'pill', text: 'signin_with', locale: 'vi' });
  };
  init();
}
async function onGoogle(resp){
  $('loginMsg').hidden = false; $('loginMsg').className = 'msg ok'; $('loginMsg').innerHTML = '<span class="spin"></span> Đang kiểm tra…';
  try {
    const res = await fetch(CONFIG.ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'admin.login', idToken: resp.credential }) }).then(r => r.json());
    if (!res.ok) throw new Error(String(res.error || '').replace(/^AUTH:\s*/, '') || 'Không đăng nhập được.');
    session = { token: res.session, email: res.email, exp: res.exp };
    store.set('gdn.session', session);
    start();
  } catch (e) {
    $('loginMsg').className = 'msg bad'; $('loginMsg').textContent = e.message;
  }
}
function signOut(message){
  if (session) fetch(CONFIG.ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: 'admin.logout', session: session.token }) }).catch(() => {});
  session = null; store.del('gdn.session');
  clearInterval(timer);
  showLogin(message);
}

// ---------------- app shell ----------------
let view = 'orders', timer = 0;
const VIEWS = { orders: renderOrders, stock: renderStock, buy: renderBuy, count: renderCount, recipes: renderRecipes, profit: renderProfit };
const TITLES = { orders: 'Đơn hàng', stock: 'Kho nguyên liệu', buy: 'Nhập hóa đơn mua hàng', count: 'Nhập số cân', recipes: 'Thẻ công thức', profit: 'Lãi & hòa vốn' };

function start(){
  $('loginView').hidden = true; $('app').hidden = false;
  go(store.get('gdn.view', 'orders'));
  clearInterval(timer);
  timer = setInterval(() => { if (document.visibilityState === 'visible' && $('detail').hidden && view === 'orders') loadOrders(true); }, CONFIG.REFRESH_MS);
}
function go(v){
  view = VIEWS[v] ? v : 'orders'; store.set('gdn.view', view);
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === view));
  $('sub').textContent = TITLES[view];
  $('main').scrollTop = 0;
  VIEWS[view]();
}
$('nav').addEventListener('click', e => { const b = e.target.closest('button[data-v]'); if (b) go(b.dataset.v); });
$('refreshBtn').addEventListener('click', () => VIEWS[view](true));
$('menuBtn').addEventListener('click', () => {
  if (confirm('Đang đăng nhập: ' + (session ? session.email : '') + '\n\nĐăng xuất?')) signOut('Đã đăng xuất.');
});
document.addEventListener('click', e => { const c = e.target.closest('[data-close]'); if (c) closeLayer(c.dataset.close); });
function openLayer(id){ $(id).hidden = false; history.pushState({ layer: id }, ''); }
function closeLayer(id){ if (!$(id).hidden) { $(id).hidden = true; if (history.state && history.state.layer === id) history.back(); } }
window.addEventListener('popstate', () => { ['cardView', 'detail'].forEach(id => { if (!$(id).hidden && !(history.state && history.state.layer === id)) $(id).hidden = true; }); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && session && view === 'orders' && $('detail').hidden) loadOrders(true); });
const loading = () => { $('main').innerHTML = '<div class="empty"><span class="spin"></span> Đang tải…</div>'; };
const fail = e => { $('main').innerHTML = '<div class="msg bad">' + esc(e.message) + '</div>'; };

// ---------------- Đơn hàng ----------------
let ORDERS = [], TODAY = '', filter = store.get('gdn.filter', 'next');
const WD = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
const dlabel = s => { if (!s) return ''; const d = new Date(s + 'T00:00:00'); return WD[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth() + 1); };
const statusCls = s => ({ 'Mới': 'p-Mới', 'Đã xác nhận': 'p-xn', 'Đang làm': 'p-lam', 'Đã giao': 'p-giao', 'Hủy': 'p-huy' }[s] || 'p-Mới');
const open = o => o.status !== 'Hủy';

function seenIds(){ return store.get('gdn.seen', null); }
function isNew(o){ const s = seenIds(); return !!s && s.indexOf(o.id) < 0 && o.status === 'Mới'; }
function markSeen(ids){ const s = seenIds() || []; ids.forEach(id => { if (s.indexOf(id) < 0) s.push(id); }); store.set('gdn.seen', s.slice(-500)); updateBadge(); }
function updateBadge(){
  const n = ORDERS.filter(isNew).length;
  $('newBadge').hidden = !n; $('newBadge').textContent = n;
  document.title = (n ? '(' + n + ') ' : '') + 'Ghét đồ ngọt · Quản lý';
  try { n ? navigator.setAppBadge && navigator.setAppBadge(n) : navigator.clearAppBadge && navigator.clearAppBadge(); } catch (e) {}
}

async function loadOrders(quiet){
  try {
    const res = await api('admin.orders');
    ORDERS = res.orders; TODAY = res.today;
    if (seenIds() === null) store.set('gdn.seen', ORDERS.map(o => o.id));   // first run: nothing is "new"
    updateBadge();
    if (view === 'orders') paintOrders();
  } catch (e) { if (!quiet) fail(e); }
}
function renderOrders(force){ if (!ORDERS.length || force) { if (!ORDERS.length) loading(); loadOrders(); } else paintOrders(); }

function nextDate(){ return ORDERS.filter(o => open(o) && o.status !== 'Đã giao' && o.date >= TODAY).map(o => o.date).sort()[0] || ''; }
function filtered(){
  const nd = nextDate();
  const f = {
    next: o => o.date === nd && open(o),
    today: o => o.date === TODAY && open(o),
    soon: o => o.date >= TODAY && open(o),
    todo: o => open(o) && o.status !== 'Đã giao',
    owe: o => open(o) && o.owed !== 0,
    all: () => true,
  }[filter] || (() => true);
  return ORDERS.filter(f).sort((a, b) => (a.date + a.place + a.id).localeCompare(b.date + b.place + b.id));
}
function paintOrders(){
  const nd = nextDate(), list = filtered();
  const chips = [['next', 'Gần nhất' + (nd ? ' ' + dlabel(nd) : '')], ['today', 'Hôm nay'], ['soon', 'Sắp tới'], ['todo', 'Chưa xong'], ['owe', 'Còn tiền'], ['all', 'Tất cả']];
  const todo = {};
  list.filter(open).forEach(o => o.lines.forEach(l => { todo[l.name] = (todo[l.name] || 0) + l.qty; }));
  const todoHtml = Object.keys(todo).length ? Object.keys(todo).sort((a, b) => todo[b] - todo[a]).map(k => '<span><b>' + todo[k] + '</b> ' + esc(k) + '</span>').join('') : '<span class="meta">Không có bánh nào.</span>';
  $('main').innerHTML =
    '<div class="chips">' + chips.map(c => '<button class="chip' + (filter === c[0] ? ' on' : '') + '" data-f="' + c[0] + '">' + esc(c[1]) + '</button>').join('') + '</div>' +
    (filter !== 'all' && filter !== 'owe' ? '<div class="box"><div class="h">Cần làm · ' + list.filter(open).length + ' đơn</div><div class="todo">' + todoHtml + '</div></div>' : '') +
    (list.length ? list.map(orderCard).join('') : '<div class="empty">Không có đơn.</div>');
  $('main').querySelectorAll('[data-f]').forEach(b => b.onclick = () => { filter = b.dataset.f; store.set('gdn.filter', filter); paintOrders(); });

const numOrBlank = v => { v = String(v || '').replace(/[^\d]/g, ''); return v === '' ? '' : Number(v); };
async function saveOrder(){

  if (!RECIPES.length) { $('main').innerHTML = '<div class="empty">Chưa có công thức nào trong tab Sản phẩm.</div>'; return; }
  const r = RECIPES.find(x => x.id === recId) || RECIPES[0];
  recId = r.id;
  const k = recScale.pieces && r.yield ? recScale.pieces / r.yield : recScale.k;
  // Upcoming orders that need this product, by delivery day (pieces, so a mini bag counts 10).
  const need = {};
  if (r.menuId) ORDERS.filter(o => open(o) && o.status !== 'Đã giao' && o.date >= TODAY).forEach(o => o.lines.forEach(l => {
    if (l.id === r.menuId) need[o.date] = (need[o.date] || 0) + l.qty * r.perUnit;
  }));
  const days = Object.keys(need).sort().slice(0, 4);
  const allDays = days.reduce((s, d) => s + need[d], 0);
  const cost = r.lines.reduce((s, l) => s + l.cost, 0) * k;
  const seg = (attr, val, on, text) => '<button ' + attr + '="' + val + '" class="' + (on ? 'on' : '') + '">' + text + '</button>';
  $('main').innerHTML =
    '<div class="chips">' + RECIPES.map(x => '<button class="chip' + (x.id === r.id ? ' on' : '') + (x.status !== 'Đang bán' ? ' off' : '') +
      '" data-r="' + x.id + '">' + esc(shortName(x)) + '</button>').join('') + '</div>' +
    '<div class="box"><div class="nm" style="font-size:18px;margin:0">' + esc(r.nameVn) + '</div>' +
      '<div class="meta">' + esc(r.id) + ' · ' + esc(r.name) + (r.status !== 'Đang bán' ? ' · ' + esc(r.status) : '') +
      (r.yield ? ' · 1 mẻ ra <b>' + fq(r.yield) + ' cái</b>' : '') + '</div>' +
      (r.notes ? '<div class="meta" style="margin-top:6px;color:var(--ink)">' + esc(r.notes) + '</div>' : '') + '</div>' +
    (r.lines.length ? '<div class="box"><div class="h">Làm bao nhiêu</div>' +
      '<div class="seg">' + [0.5, 1, 2, 3].map(v => seg('data-k', v, !recScale.pieces && recScale.k === v, (v === 0.5 ? '½' : v) + ' mẻ')).join('') + '</div>' +
      '<div class="row" style="margin-top:10px"><span style="font-size:14px">hoặc số cái</span>' +
        '<input class="inp" id="rPieces" inputmode="decimal" placeholder="vd 5" value="' + (recScale.pieces || '') + '" style="width:110px;text-align:right"></div>' +
      (days.length ? '<div class="meta" style="margin:10px 0 6px">Đơn sắp tới cần:</div><div class="seg">' +
        days.map(d => seg('data-p', need[d], recScale.pieces === need[d], dlabel(d) + ' · ' + fq(need[d]) + ' cái')).join('') +
        (days.length > 1 ? seg('data-p', allDays, recScale.pieces === allDays, 'Cả ' + days.length + ' ngày · ' + fq(allDays)) : '') + '</div>' : '') +
      '<div class="meta" style="margin-top:10px">= <b>' + fq(k) + ' mẻ</b>' + (r.yield ? ' · ra khoảng <b>' + fq(r.yield * k) + ' cái</b>' : '') + '</div></div>' +
      '<div class="box"><div class="row"><div class="h" style="margin:0">Nguyên liệu</div><span class="meta">bấm để gạch khi đã cân</span></div>' +
      r.lines.map((l, i) => {
        const q = l.qty * k, short = l.counted && l.onHand !== null && l.onHand < q;
        return '<div class="rl' + (short ? ' short' : '') + (recDone[r.id + i] ? ' done' : '') + '" data-i="' + i + '"><div class="nmi">' + esc(l.name) +
          (l.note ? '<small>' + esc(l.note) + '</small>' : '') + '</div><div class="q">' + fq(q) + ' ' + esc(l.unit) +
          (l.onHand === null ? '' : l.counted ? '<small class="k">kho ' + fq(l.onHand) + (short ? ' · thiếu' : '') + '</small>'
            : '<small>' + (l.onHand > 0 ? 'đã mua ' + fq(l.onHand) + ', ' : '') + 'chưa cân</small>') + '</div></div>';
      }).join('') + '</div>'
      : '<div class="box"><div class="meta">Món này không có công thức riêng (xem ghi chú ở trên).</div></div>') +
    '<div class="box"><div class="h">Chi phí</div>' +
      (r.lines.length ? '<div class="sumrow"><span>Nguyên liệu (' + fq(k) + ' mẻ)</span><b>' + vnd(cost) + '</b></div>' : '') +
      (r.cogs ? '<div class="sumrow"><span>Giá vốn / ' + esc(r.unit || 'cái') + '</span><b>' + vnd(r.cogs) + '</b></div>' : '') +
      (r.price ? '<div class="sumrow"><span>Giá bán</span><b>' + vnd(r.price) + '</b></div>' +
        '<div class="sumrow t"><span>Biên lãi gộp</span><b style="color:var(--ok)">' + (r.margin === null ? '—' : Math.round(r.margin * 1000) / 10 + '%') + '</b></div>'
        : '<div class="meta">Chưa có giá bán.</div>') + '</div>' +
    '<p class="meta">Sửa công thức ở tab Công thức trên Sheet, rồi bấm ↻ để tải lại.</p>';
  const m = $('main');
  m.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { recId = b.dataset.r; store.set('gdn.recipe', recId); recScale = { k: 1, pieces: 0 }; m.scrollTop = 0; renderRecipes(); });
  m.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { recScale = { k: Number(b.dataset.k), pieces: 0 }; renderRecipes(); });
  m.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { recScale = { k: 1, pieces: Number(b.dataset.p) }; renderRecipes(); });
  m.querySelectorAll('.rl').forEach(d => d.onclick = () => { const key = r.id + d.dataset.i; recDone[key] = !recDone[key]; d.classList.toggle('done', recDone[key]); });
  const pi = $('rPieces');
  if (pi) pi.onchange = () => { const v = num(pi.value); recScale = { k: 1, pieces: v > 0 ? v : 0 }; renderRecipes(); };
}

let PROFIT = null, perMode = store.get('gdn.period', 'months');

      '<div class="meta">Lãi gộp ' + esc(kv(d.real, 'Lãi gộp')) + ' so với chi phí ngoài bánh (dụng cụ, điện, gas…) ' + esc(kv(d.real, 'Chi phí')) + '.</div>' +
      '<div class="sumrow" style="margin-top:8px"><span>② Thu hồi đủ vốn chưa?</span><b>' + esc(kv(d.cash, 'Cần thêm')) + '</b></div>' +
      '<div class="meta">Đã thu ' + esc(kv(d.cash, 'Doanh thu')) + ' / đã bỏ ra ' + esc(kv(d.cash, 'Tổng tiền')) + '. Khoảng ' + esc(kv(d.cash, 'Hàng còn')) + ' vẫn nằm trong nguyên liệu chưa dùng.</div></div>' +
    (d.money && d.money.length ?
      '<div class="h" style="margin-top:14px">Tiền thật</div><div class="kpis">' +
        kpi('Đã thu thật', kv(d.money, 'Đã thu'), 'var(--ok)', 'tiền đã vào tài khoản') +
        kpi('Khách còn nợ', owe, owe !== '0' ? 'var(--acd)' : '', kv(d.money, 'Số đơn còn nợ') + ' đơn') +
        kpi('Tiền mặt ròng', net, neg(net) ? 'var(--warn)' : 'var(--ok)', 'đã thu − đã chi') +
        kpi('Phải hoàn khách', refund, refund !== '0' ? 'var(--warn)' : '') + '</div>' +
      '<div class="h">Đơn & khách</div><div class="kpis">' +
        kpi('Số đơn', kv(d.customers, 'Số đơn')) + kpi('Bánh / túi đã bán', kv(d.customers, 'Số bánh')) +
        kpi('Đơn trung bình', kv(d.customers, 'Đơn trung bình')) + kpi('Đơn nhân viên Shopee', kv(d.customers, 'Đơn của')) +
        kpi('Số khách', kv(d.customers, 'Số khách')) + kpi('Khách quay lại', kv(d.customers, 'Khách quay lại'), '', 'từ 2 đơn trở lên') + '</div>' +
      '<div class="h">Giảm giá & ship</div><div class="kpis">' +
        kpi('Đã giảm', kv(d.promo, 'Đã giảm'), '', kv(d.promo, '% giảm') + ' tiền bánh') +
        kpi('Đơn dùng mã', kv(d.promo, 'Đơn dùng mã'), '', 'TB ' + kv(d.promo, 'Giảm TB') + ' / đơn') +
        kpi('Tiền bánh trước giảm', kv(d.promo, 'Tiền bánh')) + kpi('Phí ship đã tính', kv(d.promo, 'Phí ship')) + '</div>' +
      '<div class="row" style="margin:14px 0 8px"><div class="h" style="margin:0">Xu hướng</div><div class="chips" style="margin:0">' +
        [['months', 'Tháng'], ['weeks', 'Tuần']].map(c => '<button class="chip' + (perMode === c[0] ? ' on' : '') + '" data-pm="' + c[0] + '">' + c[1] + '</button>').join('') + '</div></div>' +
      (per.length && per[0].label.indexOf('Chưa') !== 0 ?

        per.map(p => '<tr><td><b>' + esc(p.label) + '</b></td><td>' + esc(p.orders) + '</td><td>' + esc(p.revenue) + '</td><td>' + esc(p.profit) +
          '<br><span class="meta">' + esc(p.margin) + '</span></td><td>' + esc(p.received) + '</td></tr>').join('') + '</table>'
        : '<div class="empty">Chưa có đơn.</div>')
      : '<div class="msg bad">Chưa có mục Tài chính trên tab Giá vốn.</div>') +
    '<div class="h" style="margin-top:14px">Từng bánh</div>' +
    '<table><tr><th>Bánh</th><th>Biên</th><th>Bán</th><th>Lãi</th></tr>' +
    d.products.map(p => '<tr' + (low(p) ? ' style="color:var(--warn)"' : '') + '><td>' + esc(p.name) + '<br><span class="meta">vốn ' + esc(p.cost) + ' · bán ' + esc(p.price) + '</span></td><td>' + esc(p.margin) + '</td><td>' + esc(p.sold) + '</td><td>' + esc(p.earned) + '</td></tr>').join('') +
    '</table><p class="meta" style="margin-top:10px">Số liệu lấy từ tab Giá vốn trên Sheet. Bấm ↻ để tải lại.</p>';
  $('main').querySelectorAll('[data-pm]').forEach(b => b.onclick = () => { perMode = b.dataset.pm; store.set('gdn.period', perMode); renderProfit(); });

// ---------------- card drawing (same as the Sheet's "Xác nhận đơn") ----------------
const VI_SAMPLE = 'Ghét đồ ngọt Cảm ơn bạn đã ủng hộ ♥ ĂÂĐÊÔƠƯ ăâđêôơư àáảãạ ằắẳẵặ ầấẩẫậ èéẻẽẹ ềếểễệ ìíỉĩị òóỏõọ ồốổỗộ ờớởỡợ ùúủũụ ừứửữự ỳýỷỹỵ';
const fontsReady = document.fonts ? Promise.all(["700 16px 'Be Vietnam Pro'", "400 16px 'Be Vietnam Pro'", "600 16px 'Be Vietnam Pro'",
  "italic 400 16px 'Be Vietnam Pro'", "italic 700 16px 'Lora'"].map(f => document.fonts.load(f, VI_SAMPLE))).catch(() => {}) : Promise.resolve();
function tlv(id, v){ return id + ('0' + v.length).slice(-2) + v; }
function crc16(s){
  let c = 0xFFFF;
  for (let i = 0; i < s.length; i++) { c ^= s.charCodeAt(i) << 8; for (let b = 0; b < 8; b++) c = (c & 0x8000) ? ((c << 1) ^ 0x1021) & 0xFFFF : (c << 1) & 0xFFFF; }
  return ('000' + c.toString(16).toUpperCase()).slice(-4);
}
function vietqr(bin, acc, amount, info){
  let p = tlv('00', '01') + tlv('01', '12') + tlv('38', tlv('00', 'A000000727') + tlv('01', tlv('00', bin) + tlv('01', acc)) + tlv('02', 'QRIBFTTA')) +
    tlv('53', '704') + (amount > 0 ? tlv('54', String(Math.round(amount))) : '') + tlv('58', 'VN') + tlv('62', tlv('08', String(info).replace(/[^A-Za-z0-9 ]/g, '')));
  p += '6304'; return p + crc16(p);
}
function wrapText(ctx, text, maxW){
  const out = []; let line = '';
  String(text).split(' ').forEach(w => { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t; });
  if (line) out.push(line); return out;
}
function roundRect(ctx, x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function drawQR(ctx, payload, x, y, size){
  const q = qrcode(0, 'M'); q.addData(payload); q.make();
  const n = q.getModuleCount(), cell = size / (n + 4);
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(x, y, size, size); ctx.fillStyle = '#000000';
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (q.isDark(r, k)) ctx.fillRect(x + (k + 2) * cell, y + (r + 2) * cell, cell + 0.3, cell + 0.3);
}
function drawCard(d){
  const W = 600, S = 2, PAD = 28, c = document.createElement('canvas'), ctx = c.getContext('2d');
  function paint(real){
    let y = 0;
    const font = (w, size, fam) => { ctx.font = w + ' ' + size + 'px ' + (fam || "'Be Vietnam Pro', Arial, sans-serif"); };
    const text = (t, x, yy, color, align) => { if (!real) return; ctx.fillStyle = color || '#241A10'; ctx.textAlign = align || 'left'; ctx.fillText(String(t).normalize('NFC'), x, yy); };
    const rule = yy => { if (!real) return; ctx.strokeStyle = '#E8DCC8'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(PAD, yy); ctx.lineTo(W - PAD, yy); ctx.stroke(); };
    const row = (label, value, o) => { o = o || {}; font(o.bold ? 700 : 400, o.size || 15); text(label, PAD, y, o.color || '#6F6353'); font(700, o.size || 15); text(value, W - PAD, y, o.vcolor || '#241A10', 'right'); y += (o.size || 15) + 12; };
    if (real) { ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, W, c.height / S); ctx.fillStyle = '#A85C22'; ctx.fillRect(0, 0, W, 92); }
    font('italic 700', 34, "'Lora', 'Be Vietnam Pro', serif"); text('Ghét đồ ngọt', PAD, 52, '#FFFFFF');
    font(600, 14); text('PHIẾU XÁC NHẬN ĐƠN', PAD, 76, '#FBE7D3');
    y = 132; font(700, 26); text(d.id, PAD, y, '#A85C22');
    if (real) { ctx.fillStyle = '#E6F4EC'; roundRect(ctx, W - PAD - 150, y - 24, 150, 32, 16); ctx.fill(); }
    font(700, 13); text('✓ ĐÃ XÁC NHẬN', W - PAD - 75, y - 3, '#2E7D4F', 'center');
    y += 34; font(400, 15); text('Khách:', PAD, y, '#6F6353'); font(700, 15); text(d.name, PAD + 54, y); y += 26;
    font(400, 15); text('Nhận:', PAD, y, '#6F6353'); font(700, 15);
    wrapText(ctx, d.pickup + (d.address ? ' – ' + d.address : ''), W - PAD * 2 - 54).forEach(l => { text(l, PAD + 54, y); y += 22; });
    y += 8; rule(y); y += 30;
    d.lines.forEach(l => {
      font(700, 16);
      wrapText(ctx, (l.qty ? l.qty + ' × ' : '') + l.name, W - PAD * 2 - 120).forEach((t, k) => { text(t, PAD, y); if (k === 0) text(vnd(l.total), W - PAD, y, '#241A10', 'right'); y += 22; });
      if (l.note) { font('italic 400', 14); wrapText(ctx, '↳ ' + l.note, W - PAD * 2 - 20).forEach(t => { text(t, PAD + 14, y, '#A85C22'); y += 20; }); }
      y += 8;
    });
    rule(y); y += 28;
    row('Tiền bánh', vnd(d.subtotal));
    if (d.discount) row('Giảm' + (d.code ? ' (mã ' + d.code + ')' : ''), '− ' + vnd(d.discount), { vcolor: '#2E7D4F' });
    row('Phí ship', d.free ? 'Free' : d.ship === null ? 'Shop báo sau' : vnd(d.ship));
    row('Tổng', vnd(d.total), { bold: true, size: 17, color: '#241A10' });
    if (d.paid) row('Đã nhận', vnd(d.paid));
    y += 4;
    if (d.owed > 0) {
      if (real) { ctx.fillStyle = '#FFF4D6'; roundRect(ctx, PAD, y - 6, W - PAD * 2, 250, 14); ctx.fill(); }
      font(700, 18); text('Cần chuyển khoản: ' + vnd(d.owed), PAD + 18, y + 24, '#8F4E1B');
      if (real) drawQR(ctx, vietqr(d.shop.BANK_BIN, d.shop.ACCOUNT_NO, d.owed, d.id), W - PAD - 18 - 190, y + 40, 190);
      let ty = y + 64;
      [['Ngân hàng', d.shop.BANK_NAME], ['Số TK', d.shop.ACCOUNT_NO], ['Chủ TK', d.shop.ACCOUNT_NAME], ['Nội dung', d.id]].forEach(p => {
        font(400, 13); text(p[0], PAD + 18, ty, '#6F6353'); font(700, 15); text(p[1], PAD + 18, ty + 19); ty += 44; });
      y += 262;
    } else {
      if (real) { ctx.fillStyle = '#E6F4EC'; roundRect(ctx, PAD, y - 6, W - PAD * 2, 44, 12); ctx.fill(); }
      font(700, 16); text('✓ Đã thanh toán đủ. Cảm ơn bạn!', W / 2, y + 22, '#2E7D4F', 'center'); y += 56;
    }
    if (d.customerNote) { y += 6; font(700, 13); text('Ghi chú của bạn', PAD, y, '#6F6353'); y += 20; font('italic 400', 14); wrapText(ctx, d.customerNote, W - PAD * 2).forEach(t => { text(t, PAD, y); y += 20; }); }
    if (d.tips.length) { y += 10; font(700, 14); text('Bảo quản', PAD, y, '#A85C22'); y += 22; font(400, 13.5);
      d.tips.forEach(tp => wrapText(ctx, '• ' + tp, W - PAD * 2).forEach(t => { text(t, PAD, y, '#4A3E31'); y += 20; })); }
    y += 14; rule(y); y += 26;
    font(400, 13); text('Liên hệ: ' + d.shop.CONTACTS, W / 2, y, '#6F6353', 'center'); y += 22;
    font('italic 700', 15, "'Lora', 'Be Vietnam Pro', serif"); text('Cảm ơn bạn đã ủng hộ Ghét đồ ngọt ♥', W / 2, y, '#A85C22', 'center');
    return y + 26;
  }
  const h = paint(false); c.width = W * S; c.height = Math.ceil(h * S); ctx.scale(S, S); paint(true);
  return c;
}
function cardMessage(d){
  const t = ['Ghét đồ ngọt xác nhận đơn ' + d.id + ' của ' + d.name + ':'];
  d.lines.forEach(l => t.push('• ' + (l.qty ? l.qty + '× ' : '') + l.name + ' – ' + vnd(l.total) + (l.note ? ' (' + l.note + ')' : '')));
  t.push('Nhận: ' + d.pickup + (d.address ? ' – ' + d.address : ''));
  t.push('Tổng: ' + vnd(d.total) + (d.discount ? ' (đã giảm ' + vnd(d.discount) + (d.code ? ', mã ' + d.code : '') + ')' : '') + (d.free ? ' · free ship' : d.ship === null ? ' · phí ship shop báo sau' : ''));
  t.push(d.owed > 0 ? 'Cần chuyển khoản ' + vnd(d.owed) + ': ' + d.shop.BANK_NAME + ' ' + d.shop.ACCOUNT_NO + ' – ' + d.shop.ACCOUNT_NAME + ', nội dung ' + d.id + '.' : 'Đã thanh toán đủ. Cảm ơn bạn!');
  return t.join('\n');
}
